name: bi-brain
services:
  brain:
    build:
      context: ..
    environment:
      BRAIN_PUBLIC_ORIGIN: https://${BRAIN_DOMAIN:?Set BRAIN_DOMAIN to the deployment hostname}
    volumes:
      - brain-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    networks:
      - backend
  proxy:
    image: caddy:2.11.7-alpine
    environment:
      BRAIN_DOMAIN: ${BRAIN_DOMAIN:?Set BRAIN_DOMAIN to the deployment hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      brain:
        condition: service_healthy
    networks:
      - backend
networks:
  backend:
volumes:
  brain-data:
  caddy-data:
  caddy-config:
